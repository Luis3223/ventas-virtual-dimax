<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#redGrad)" stroke-width="6" stroke-opacity="0.6" />

  <!-- Outer Ring / Disc Brake Accent -->
  <circle cx="256" cy="230" r="160" stroke="#334155" stroke-width="12" stroke-dasharray="16 12" opacity="0.5" />
  <circle cx="256" cy="230" r="130" stroke="#475569" stroke-width="4" opacity="0.4" />

  <!-- Motorcycle Silhouette / Icon -->
  <g transform="translate(106, 120) scale(0.6)">
    <!-- Rear Wheel -->
    <circle cx="70" cy="210" r="55" stroke="url(#redGrad)" stroke-width="18" fill="none" />
    <circle cx="70" cy="210" r="25" fill="#e2e8f0" />
    <!-- Front Wheel -->
    <circle cx="430" cy="210" r="55" stroke="url(#redGrad)" stroke-width="18" fill="none" />
    <circle cx="430" cy="210" r="25" fill="#e2e8f0" />
    <!-- Frame & Body -->
    <path d="M70 210 L160 160 L240 160 L320 80 L350 80 L430 210" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M160 160 L220 210 L300 210 L360 150" stroke="#ef4444" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Gas Tank & Seat -->
    <path d="M180 130 C220 100 280 100 310 135 L260 155 L170 155 Z" fill="url(#redGrad)" />
    <!-- Handlebar & Headlight -->
    <path d="M330 65 L360 85" stroke="#f8fafc" stroke-width="14" stroke-linecap="round" />
    <circle cx="375" cy="90" r="12" fill="url(#goldGrad)" filter="url(#glow)" />
    <!-- Exhaust Pipe -->
    <path d="M220 215 L120 230" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Currency / Commission Shield Badge -->
  <g transform="translate(256, 260)">
    <circle cx="0" cy="0" r="46" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="0" cy="0" r="38" stroke="#78350f" stroke-width="3" fill="none" />
    <text x="0" y="16" font-family="Arial, sans-serif" font-weight="900" font-size="48" fill="#1e1b4b" text-anchor="middle">$</text>
  </g>

  <!-- DIMAX Brand Banner -->
  <rect x="76" y="375" width="360" height="66" rx="16" fill="url(#redGrad)" />
  <text x="256" y="420" font-family="Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="4" fill="#ffffff" text-anchor="middle">DIMAX</text>
  <text x="256" y="465" font-family="Arial, sans-serif" font-weight="700" font-size="16" letter-spacing="3" fill="#94a3b8" text-anchor="middle">VENTAS VIRTUALES</text>
</svg>
